[project]
name = "img2data"
version = "0.1.0"
description = "Reverse-engineer numeric data from images of plots"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "tkinterdnd2>=0.6.4",
    "ttkbootstrap>=2.2.3",
]

[project.scripts]
img2data = "img2data.app:main"

[project.gui-scripts]
img2data-gui = "img2data.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img2data"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
